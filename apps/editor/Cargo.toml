[package]
name = "kadr-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kadr — native AI-first non-linear video editor"

[[bin]]
name = "kadr"
path = "src/main.rs"

[dependencies]
kadr-core = { path = "../../crates/core" }
kadr-project = { path = "../../crates/project" }
kadr-timeline = { path = "../../crates/timeline" }
kadr-media = { path = "../../crates/media" }
kadr-scene = { path = "../../crates/scene" }
kadr-render = { path = "../../crates/render" }
kadr-playback = { path = "../../crates/playback" }
kadr-project-scenes = { path = "../../crates/project-scenes" }
kadr-audio = { path = "../../crates/audio" }
kadr-analysis = { path = "../../crates/analysis" }
kadr-jobs = { path = "../../crates/jobs" }
kadr-cache = { path = "../../crates/cache" }
kadr-ai = { path = "../../crates/ai" }
kadr-i18n = { path = "../../crates/i18n" }
kadr-mcp-bridge = { path = "../../crates/mcp-bridge" }
png = "0.17"
slint = { workspace = true, features = ["unstable-winit-030", "mcp"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rfd = "0.17"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
slint-build.workspace = true
